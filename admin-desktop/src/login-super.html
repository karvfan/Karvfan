<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<title>ورود سوپرادمین</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="auth-wrap">
  <div class="auth-card">
    <div class="auth-head">
      <div class="ic">👑</div>
      <h2>ورود سوپرادمین</h2>
      <p>دسترسی کامل به کل سامانه — همه‌ی استان‌ها و شهرستان‌ها</p>
    </div>
    <div id="bioRow" class="bio-login-row hidden">
      <button type="button" class="btn btn-navy btn-block bio-btn" onclick="adminBioLogin('admin_super')">🔓 ورود سریع با اثر انگشت / Windows Hello</button>
      <button type="button" class="bio-forget-link" onclick="adminBioForget('admin_super')">این دستگاه رو فراموش کن</button>
      <div class="bio-or">یا با ایمیل و رمز وارد شو</div>
    </div>
    <form id="loginForm">
      <div class="field"><label>ایمیل یا کد ملی</label><input id="email" type="text" placeholder="کد ملی یا ایمیل"></div>
      <div class="field"><label>رمز عبور</label><input id="pass" type="password" placeholder="••••••••"></div>
      <label id="bioRemember" class="bio-remember-row hidden">
        <input type="checkbox" id="bioRememberChk"> این دستگاه رو برای ورود سریع بعدی با اثر انگشت به‌خاطر بسپار
      </label>
      <div class="field-err" id="loginErr"></div>
      <button class="btn btn-navy btn-block" id="loginBtn" type="submit">ورود</button>
    </form>
    <a href="#" onclick="forgotPasswordDesktop();return false" style="display:block;text-align:center;margin-top:14px;font-size:13px;color:var(--sub)">رمز رو فراموش کردم؟</a>
    <a class="back-link" href="login-select.html">← بازگشت به انتخاب سطح دسترسی</a>
  </div>
</div>
<script src="js/supabase.js"></script>
<script src="js/config.js"></script>
<script src="js/biometric.js"></script>
<script src="js/login.js"></script>
<script src="js/show-password.js"></script>
<script>initLogin(['super_admin'], 'admin_super');</script>
</body>
</html>
