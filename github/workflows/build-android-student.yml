name: Build Android (Student)

on:
  push:
    branches: [ main ]
    paths:
      - 'student/**'
      - 'shared/**'
      - 'about.html'
      - 'karvfan-android-student/**'
      - 'capacitor.config.student.json'
      - 'package.json'
      - '.github/workflows/build-android-student.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Install npm dependencies
        run: npm install

      - name: Prepare web assets (www-student/)
        run: |
          mkdir -p www-student
          cp -r student/* www-student/
          cp -r shared www-student/shared
          cp about.html www-student/about.html
          # مسیرهای نسبی "../shared/..." که برای ساختار سایت (student/ زیرپوشه) نوشته شدن،
          # چون اینجا index.html خودش در ریشه‌ی webDir قرار می‌گیره، به "shared/..." تبدیل می‌شن
          grep -rl '\.\./shared/' www-student --include="*.html" | xargs -r sed -i 's#\.\./shared/#shared/#g'
          grep -rl '\.\./about\.html' www-student --include="*.html" | xargs -r sed -i 's#\.\./about\.html#about.html#g'

      - name: Embed build version (برای هشدار آپدیت داخل اپ)
        run: |
          SHORT_SHA=$(echo "${GITHUB_SHA}" | cut -c1-7)
          echo "const BUILD_VERSION = \"$SHORT_SHA\";" > www-student/shared/js/build-version.js
          echo "$SHORT_SHA" > student-version.txt

      - name: Use student Capacitor config
        run: cp capacitor.config.student.json capacitor.config.json

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Set up JDK 21 (latest JDK fully supported by Gradle 8.14 / AGP 8.13)
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Decode Android release keystore (امضای واقعی release — یکسان در همه‌ی بیلدها تا آپدیت جای نسخه‌ی قبلی بشینه)
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/karvfan-release.keystore"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/karvfan-release.keystore" >> "$GITHUB_ENV"
          echo "ANDROID_KEYSTORE_PASSWORD=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_PASSWORD=${{ secrets.ANDROID_KEY_PASSWORD }}" >> "$GITHUB_ENV"

      - name: Grant execute permission for gradlew
        working-directory: karvfan-android-student
        run: chmod +x ./gradlew

      - name: Build signed release APK
        working-directory: karvfan-android-student
        run: ./gradlew assembleRelease --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v6
        with:
          name: karvfan-student-release-apk
          path: karvfan-android-student/app/build/outputs/apk/release/app-release.apk

      - name: Rename APK for release
        run: cp karvfan-android-student/app/build/outputs/apk/release/app-release.apk karvfan-student.apk

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-builds
          name: "آخرین نسخه‌های ساخته‌شده (خودکار)"
          make_latest: true
          files: |
            karvfan-student.apk
            student-version.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

