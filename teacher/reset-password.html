<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>تغییر رمز عبور | کار و فناوری</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="../shared/js/vendor/supabase.js"></script>
<link rel="stylesheet" href="../shared/css/style.css">
</head>
<body>
<div class="auth-wrap">
  <div class="auth-card">
    <div class="auth-head">
      <div class="ic">🔑</div>
      <h2>تعیین رمز عبور جدید</h2>
      <p id="rpStatus">در حال بررسی لینک...</p>
    </div>
    <div id="rpForm" class="hidden">
      <div class="field"><label>رمز عبور جدید</label><input id="rpPass" type="password" placeholder="حداقل ۶ کاراکتر"></div>
      <div class="field"><label>تکرار رمز عبور</label><input id="rpPass2" type="password"></div>
      <div class="field-err" id="rpErr"></div>
      <button class="btn btn-sky btn-block" id="rpBtn" onclick="submitNewPassword()">ذخیره‌ی رمز جدید</button>
    </div>
    <a class="back-link" href="index.html" style="display:block;text-align:center;margin-top:14px">بازگشت به صفحه‌ی ورود</a>
  </div>
</div>
<script src="../shared/js/config.js"></script>
<script src="../shared/js/show-password.js"></script>
<script>
(async function(){
  const { data:{ session } } = await sb.auth.getSession();
  if(session){
    document.getElementById('rpStatus').textContent = 'لینک معتبره — رمز جدیدتون رو وارد کنید';
    document.getElementById('rpForm').classList.remove('hidden');
  }else{
    document.getElementById('rpStatus').textContent = 'این لینک نامعتبر یا منقضی‌شده — از صفحه‌ی ورود دوباره درخواست بدید';
  }
})();
async function submitNewPassword(){
  const p1 = document.getElementById('rpPass').value, p2 = document.getElementById('rpPass2').value;
  const errEl = document.getElementById('rpErr'); errEl.textContent='';
  if(!p1 || p1.length<6){ errEl.textContent='رمز باید حداقل ۶ کاراکتر باشه'; return; }
  if(p1!==p2){ errEl.textContent='دو رمز یکی نیستن'; return; }
  const { error } = await sb.auth.updateUser({ password: p1 });
  if(error){ errEl.textContent = 'خطا: ' + error.message; return; }
  alert('رمز عوض شد ✅ حالا می‌تونید با رمز جدید وارد بشید.');
  window.location.href = 'index.html';
}
</script>
</body>
</html>
