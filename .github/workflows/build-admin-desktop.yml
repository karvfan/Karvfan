name: Build Admin Desktop (Windows)

on:
  push:
    branches: [main]
    paths:
      - 'admin-desktop/**'
      - '.github/workflows/build-admin-desktop.yml'
  workflow_dispatch: {}

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: admin-desktop
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build Windows installer
        run: npm run dist

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: karvfan-admin-desktop-windows
          path: |
            admin-desktop/dist/*.exe
          if-no-files-found: error
