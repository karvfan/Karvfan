name: Build Android

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Install npm dependencies
        run: npm install

      - name: Prepare web assets (www/)
        run: |
          mkdir -p www
          cp -r index.html manifest.json sw.js css js icon-192.png icon-512.png icon-512-maskable.png www/

      - name: Sync Capacitor Android project
        run: |
          set +e
          npx cap sync android > sync_output.log 2>&1
          code=$?
          cat sync_output.log
          if [ $code -ne 0 ]; then
            ERRMSG=$(tail -c 900 sync_output.log | sed ':a;N;$!ba;s/\n/%0A/g')
            echo "::error::CAP SYNC FAILED: $ERRMSG"
            exit $code
          fi

      - name: Set up JDK 21 (latest JDK fully supported by Gradle 8.14 / AGP 8.13)
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Grant execute permission for gradlew
        working-directory: karvfan-android
        run: chmod +x ./gradlew

      - name: Build debug APK
        working-directory: karvfan-android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v6
        with:
          name: karvfan-debug-apk
          path: karvfan-android/app/build/outputs/apk/debug/app-debug.apk
