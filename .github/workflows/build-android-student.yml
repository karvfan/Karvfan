name: Build Android (Student)

on:
  push:
    branches: [ main ]
    paths:
      - 'student/**'
      - 'shared/**'
      - 'karvfan-android-student/**'
      - 'capacitor.config.student.json'
      - 'package.json'
      - '.github/workflows/build-android-student.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Install npm dependencies
        run: npm install

      - name: Prepare web assets (www-student/)
        run: |
          mkdir -p www-student
          cp -r student/* www-student/
          cp -r shared www-student/shared
          # مسیرهای نسبی "../shared/..." که برای ساختار سایت (student/ زیرپوشه) نوشته شدن،
          # چون اینجا index.html خودش در ریشه‌ی webDir قرار می‌گیره، به "shared/..." تبدیل می‌شن
          grep -rl '\.\./shared/' www-student --include="*.html" | xargs -r sed -i 's#\.\./shared/#shared/#g'

      - name: Use student Capacitor config
        run: cp capacitor.config.student.json capacitor.config.json

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Set up JDK 21 (latest JDK fully supported by Gradle 8.14 / AGP 8.13)
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Grant execute permission for gradlew
        working-directory: karvfan-android-student
        run: chmod +x ./gradlew

      - name: Build debug APK
        working-directory: karvfan-android-student
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v6
        with:
          name: karvfan-student-debug-apk
          path: karvfan-android-student/app/build/outputs/apk/debug/app-debug.apk
